
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Body Explorer</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="start-screen">
    <div class="menu">
      <h1>HUMAN BODY EXPLORER</h1>
      <p>Explore the inside of a human body.</p>
      <button id="start-button">ENTER THE BODY</button>
      <div class="instructions">
        <p>W A S D — Move</p>
        <p>Mouse — Look around</p>
        <p>ESC — Release mouse</p>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="location">MOUTH ENTRANCE</div>
    <div id="crosshair">+</div>
    <div id="message">WASD to explore</div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
